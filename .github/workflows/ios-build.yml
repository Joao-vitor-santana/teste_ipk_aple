name: Build iOS (IPA sem assinatura)

on:
  workflow_dispatch:   # botão "Run workflow" na aba Actions
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Cordova
        run: npm install -g cordova

      - name: Dependências do projeto
        run: |
          if [ -f package-lock.json ]; then npm ci; elif [ -f package.json ]; then npm install; fi

      - name: Adicionar plataforma iOS
        run: |
          if [ ! -d platforms/ios ]; then cordova platform add ios; fi
          cordova prepare ios

      - name: Compilar sem assinatura
        working-directory: platforms/ios
        run: |
          WS=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WS%.xcworkspace}"
          xcodebuild -workspace "$WS" -scheme "$SCHEME" \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Gerar o .ipa
        working-directory: platforms/ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -qr app-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: app-ios-ipa
          path: platforms/ios/app-unsigned.ipa
